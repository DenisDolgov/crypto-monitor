[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feedscan"
version = "0.1.0"
description = "Inventory of public machine-readable exchange-rate feeds"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
feedscan = "feedscan.cli:main"

[tool.setuptools.packages.find]
include = ["feedscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
